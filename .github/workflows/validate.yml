name: Project validation

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pgvector and start isolated PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          PG_BIN=$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1)
          PG_BIN_DIR=$(dirname "$PG_BIN")
          PG_MAJOR=$("$PG_BIN_DIR/postgres" --version | cut -d ' ' -f 3 | cut -d . -f 1)
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-${PG_MAJOR}-pgvector"
          python backend/scripts/provision_test_postgresql.py start --bin-dir "$PG_BIN_DIR"
      - name: Install pgvector and start isolated PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgInit = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' | Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $pgInit) { throw 'PostgreSQL binaries are required by the test matrix' }
          $env:PGROOT = $pgInit.Directory.Parent.FullName
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          if (-not $vsPath) { throw 'Visual Studio x64 C++ tools are required to build pgvector' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw 'Visual Studio x64 environment script is missing' }
          $pgvectorSource = Join-Path $env:RUNNER_TEMP 'limituplab-pgvector-v0.8.7'
          git clone --depth 1 --branch v0.8.7 https://github.com/pgvector/pgvector.git $pgvectorSource
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the pinned pgvector source' }
          Push-Location -LiteralPath $pgvectorSource
          try {
            cmd.exe /d /s /c "call `"$vcvars`" && nmake /NOLOGO /F Makefile.win && nmake /NOLOGO /F Makefile.win install"
            if ($LASTEXITCODE -ne 0) { throw 'pgvector compilation or installation failed' }
          } finally {
            Pop-Location
          }
          python backend/scripts/provision_test_postgresql.py start --bin-dir $pgInit.Directory.FullName
      - name: Run shared acceptance gates
        run: python scripts/check_project.py
      - name: Stop isolated PostgreSQL
        if: always()
        run: python backend/scripts/provision_test_postgresql.py stop
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            output/validation/*/*.log
            output/validation/*/*.json
            output/validation/*/*.xml
          if-no-files-found: ignore
          retention-days: 7

  postgresql:
    # PG18 storage contracts complement the matrix's matching local server/client
    # backup archive checks; optional client-only checks may skip in this job.
    name: PostgreSQL storage and shared runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: limituplab_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: limituplab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limituplab_test -d limituplab_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LIMITUPLAB_TEST_DATABASE_URL: postgresql+psycopg://limituplab_test:disposable_ci_password@127.0.0.1:5432/limituplab_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify all backend tests including real PostgreSQL contracts
        working-directory: backend
        run: python -m pytest -q

  deploy:
    name: Deploy tagged production release
    needs: [validate, postgresql]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: limituplab-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy the validated commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: python3 deploy/ci_deploy.py
