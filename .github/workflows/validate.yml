name: Project validation

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start isolated PostgreSQL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          PG_BIN=$(find /usr/lib/postgresql -path '*/bin/initdb' | sort -V | tail -1)
          python backend/scripts/provision_test_postgresql.py start --bin-dir "$(dirname "$PG_BIN")"
      - name: Start isolated PostgreSQL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pgInit = Get-ChildItem 'C:\Program Files\PostgreSQL\*\bin\initdb.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $pgInit) { throw 'PostgreSQL binaries are required by the test matrix' }
          python backend/scripts/provision_test_postgresql.py start --bin-dir $pgInit.Directory.FullName
      - name: Validate golden case contracts without model calls
        run: python backend/scripts/run_agent_golden.py --mode validate
      - name: Run shared acceptance gates
        run: python scripts/check_project.py
      - name: Stop isolated PostgreSQL
        if: always()
        run: python backend/scripts/provision_test_postgresql.py stop
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            output/validation/*/*.log
            output/validation/*/*.json
            output/validation/*/*.xml
          if-no-files-found: ignore
          retention-days: 7

  postgresql:
    # PG18 storage contracts complement the matrix's matching local server/client
    # backup archive checks; optional client-only checks may skip in this job.
    name: PostgreSQL storage and shared runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: limituplab_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: limituplab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U limituplab_test -d limituplab_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      LIMITUPLAB_TEST_DATABASE_URL: postgresql+psycopg://limituplab_test:disposable_ci_password@127.0.0.1:5432/limituplab_test
      LIMITUPLAB_TEST_EVAL_DATABASE_URL: postgresql+psycopg://limituplab_test:disposable_ci_password@127.0.0.1:5432/limituplab_eval_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Create isolated evaluation database
        run: |
          python - <<'PY'
          import os
          import sqlalchemy as sa
          engine = sa.create_engine(os.environ['LIMITUPLAB_TEST_DATABASE_URL'], isolation_level='AUTOCOMMIT')
          with engine.connect() as connection:
              connection.exec_driver_sql('CREATE DATABASE limituplab_eval_test')
          engine.dispose()
          PY
      - name: Verify all backend tests including real PostgreSQL contracts
        working-directory: backend
        run: python -m pytest -q

  deploy:
    name: Deploy tagged production release
    needs: [validate, postgresql]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: limituplab-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release commit
        id: release
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy the validated commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: python3 deploy/ci_deploy.py
