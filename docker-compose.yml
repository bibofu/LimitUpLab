name: limituplab

services:
  backend:
    image: limituplab-backend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_URL: ${LIMITUPLAB_DATABASE_URL:?Set the PostgreSQL application URL}
      LIMITUPLAB_DATA_DIRECTORY: /app/data
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: limituplab-frontend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  recommendation-refresh:
    image: limituplab-backend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_URL: ${LIMITUPLAB_DATABASE_URL:?Set the PostgreSQL application URL}
      LIMITUPLAB_DATA_DIRECTORY: /app/data
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    healthcheck:
      disable: true
    command:
      - python
      - scripts/run_recommendation_refresh_loop.py
      - --lock-path
      - /tmp/recommendation_refresh.lock
      - --report-path
      - /app/data/recommendation_refresh_latest.json

  quality-worker:
    image: limituplab-backend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_URL: ${LIMITUPLAB_DATABASE_URL:?Set the PostgreSQL application URL}
      LIMITUPLAB_DATA_DIRECTORY: /app/data
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["python", "scripts/run_quality_worker.py", "--interval", "10"]

  quality-judge-worker:
    image: limituplab-backend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_URL: ${LIMITUPLAB_DATABASE_URL:?Set the PostgreSQL application URL}
      LIMITUPLAB_DATA_DIRECTORY: /app/data
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["python", "scripts/run_quality_judge_worker.py", "--interval", "5"]

  daily-update:
    image: limituplab-backend:${LIMITUPLAB_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    profiles: ["jobs"]
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_URL: ${LIMITUPLAB_DATABASE_URL:?Set the PostgreSQL application URL}
      LIMITUPLAB_DATA_DIRECTORY: /app/data
      # The CLI already retries 4001/429 with backoff and honours Retry-After up to
      # 30s, so the interactive 15s default kills it mid-retry and reports a fake
      # timeout. Batch runs wait out one retry budget instead.
      LIMITUPLAB_HITHINK_TIMEOUT_SECONDS: ${LIMITUPLAB_DAILY_HITHINK_TIMEOUT_SECONDS:-45}
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    command: ["python", "scripts/run_daily_close_loop.py", "--trigger", "scheduled"]

volumes:
  limituplab-data:
    name: limituplab-data
