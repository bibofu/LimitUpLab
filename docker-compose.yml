name: limituplab

services:
  backend:
    image: limituplab-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_PATH: /app/data/limituplab.sqlite
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    expose:
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    image: limituplab-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  recommendation-refresh:
    image: limituplab-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_PATH: /app/data/limituplab.sqlite
      LIMITUPLAB_RECOMMENDATION_REFRESH_MINUTES: ${LIMITUPLAB_RECOMMENDATION_REFRESH_MINUTES:-30}
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    healthcheck:
      disable: true
    command:
      - python
      - scripts/run_recommendation_refresh_loop.py
      - --lock-path
      - /tmp/recommendation_refresh.lock
      - --report-path
      - /app/data/recommendation_refresh_latest.json

  daily-update:
    image: limituplab-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_HITHINK_FINANCE: ${INSTALL_HITHINK_FINANCE:-true}
    profiles: ["jobs"]
    init: true
    env_file:
      - .env.production
    environment:
      LIMITUPLAB_DATABASE_PATH: /app/data/limituplab.sqlite
      TZ: Asia/Shanghai
    volumes:
      - limituplab-data:/app/data
    command: ["python", "scripts/run_daily_close_loop.py", "--trigger", "scheduled"]

volumes:
  limituplab-data:
    name: limituplab-data
